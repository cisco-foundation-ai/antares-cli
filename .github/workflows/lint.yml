---
name: "lint"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }} @ ${{ ((github.ref_name == 'main') && github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  lint:
    name: "lint and typecheck"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: "Set up Python"
        run: uv python install 3.11

      - name: "Install dependencies"
        run: uv sync --frozen --group dev

      - name: "Run ruff"
        run: uv run ruff check --no-cache .

      - name: "Check formatting"
        run: uv run ruff format --check .

      - name: "Run mypy"
        run: uv run mypy --no-incremental src

  repository-standards:
    name: "repository standards"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Run repository standards checks"
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_GITIGNORED_FILES: true
          LINTER_RULES_PATH: ".github/linters"
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          GITHUB_ACTIONS_CONFIG_FILE: ".actionlint.yml"
          MARKDOWN_CONFIG_FILE: ".markdownlint.yml"
          TRIVY_CONFIG_FILE: ".trivy.yml"
          YAML_CONFIG_FILE: ".yamllint.yml"
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_MARKDOWN: true
          VALIDATE_TRIVY: true
          VALIDATE_YAML: true
