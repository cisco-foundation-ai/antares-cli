---
name: "scorecard"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 6"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  run-scorecard:
    # The shared OSPO workflow checks out without contents permission. That
    # works for public repositories but cannot clone this non-public candidate.
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: cisco-ospo/.github/.github/workflows/_scorecard.yml@c4668d5c4678f539295df629f7a48d4677808aa8
    permissions:
      contents: read
      id-token: write
      security-events: write
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      publish-results: true
