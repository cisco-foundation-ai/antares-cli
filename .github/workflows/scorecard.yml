---
name: "scorecard"

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 6"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  run-scorecard:
    uses: cisco-ospo/.github/.github/workflows/_scorecard.yml@c4668d5c4678f539295df629f7a48d4677808aa8
    permissions:
      id-token: write
      security-events: write
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      # Keep results private here and publish automatically from a future
      # public repository created from this source.
      publish-results: ${{ github.event.repository.visibility == 'public' }}
