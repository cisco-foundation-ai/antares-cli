---
name: "unit tests"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }} @ ${{ ((github.ref_name == 'main') && github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  unit-tests:
    name: "unit tests"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      COLUMNS: "160"
      TERM: "xterm-256color"
    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: "Set up Python"
        run: uv python install 3.11

      - name: "Install dependencies"
        run: uv sync --frozen --group dev

      - name: "Install read-only command dependencies"
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: "Run tests"
        run: uv run pytest -q -p no:cacheprovider

      - name: "Build release artifacts"
        run: uv build

      - name: "Verify provider-neutral wheel"
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          uv run python tools/verify_public_wheel.py "$wheel_path"

      - name: "Smoke-test the built wheel across supported Python versions"
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          uv python install 3.11 3.12 3.13 3.14
          for version in 3.11 3.12 3.13 3.14; do
            environment=".wheel-smoke-${version}"
            uv venv --python "$version" "$environment"
            uv pip install --python "$environment/bin/python" "$wheel_path"
            "$environment/bin/python" -m compileall -q "$environment/lib"
            "$environment/bin/antares" --version
            "$environment/bin/antares" --help >/dev/null
            "$environment/bin/antares" plan src/antares_cli --format json >/dev/null
            "$environment/bin/antares" completion bash | grep -q _ANTARES_COMPLETE
          done

      - name: "Record release artifact checksums"
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: "Upload verified release artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: antares-cli-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
