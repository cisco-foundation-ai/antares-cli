---
name: "stale check"

on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  mark-stale:
    uses: cisco-ospo/.github/.github/workflows/_stale.yml@c4668d5c4678f539295df629f7a48d4677808aa8
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      days-until-stale: 60
      days-until-close: 7
      stale-label: "stale"
      exempt-label: "keep"
