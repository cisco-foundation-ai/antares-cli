---
name: "release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: "build and verify release artifacts"
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: "Set up Python"
        run: uv python install 3.11

      - name: "Verify tag matches package version"
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(uv run python -c 'import antares_cli; print(antares_cli.__version__)')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: "Install dependencies"
        run: uv sync --frozen --group dev

      - name: "Install read-only command dependencies"
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: "Run tests"
        run: uv run pytest -q -p no:cacheprovider

      - name: "Build release artifacts"
        run: uv build

      - name: "Verify provider-neutral wheel"
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          uv run python tools/verify_public_wheel.py "$wheel_path"

      - name: "Record release artifact checksums"
        run: sha256sum dist/* > SHA256SUMS

      - name: "Upload verified distributions"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "antares-cli-distributions-${{ github.ref_name }}"
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: "Upload release checksums"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "antares-cli-checksums-${{ github.ref_name }}"
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: "publish public release"
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'cisco-foundation-ai/antares-cli' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-22.04
    environment:
      name: release
      url: "https://pypi.org/project/cisco-antares-cli/"
    permissions:
      contents: write
      id-token: write

    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: "Download verified distributions"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "antares-cli-distributions-${{ github.ref_name }}"
          path: dist/

      - name: "Download release checksums"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "antares-cli-checksums-${{ github.ref_name }}"
          path: ./

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
            SHA256SUMS
          generate_release_notes: true
