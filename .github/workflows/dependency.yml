---
name: "dependency review"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  dependency-review:
    name: "dependency review"
    # GitHub's dependency review API requires a public repository or GitHub
    # Advanced Security. Keep the required check successful while this release
    # candidate is non-public, then activate the review automatically at launch.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Harden runner"
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: "Check out repository"
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Review dependency changes"
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: "high"
          deny-licenses: "AGPL-1.0, AGPL-3.0"
          comment-summary-in-pr: true
          warn-on-openssf-scorecard-level: 3

      - name: "Record non-public dependency-review status"
        if: ${{ github.event.repository.visibility != 'public' }}
        run: echo "Dependency Review activates automatically when this repository becomes public."
